name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required validation
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runtime_required: ${{ steps.scope.outputs.runtime_required }}

    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Determine validation scope
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          full=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || ( "$EVENT_NAME" == "pull_request_review" && "$REVIEW_STATE" == "approved" ) ]]; then
            full=true
          fi

          changed_files=""
          if [[ "$full" == "true" ]]; then
            changed_files="$(git ls-files)"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == agent/* ]]; then
            pr_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls?state=open&head=${REPOSITORY_OWNER}:${REF_NAME}&per_page=10")"
            pr_count="$(jq 'length' <<<"$pr_json")"
            if [[ "$pr_count" == "1" ]]; then
              base_sha="$(jq -r '.[0].base.sha' <<<"$pr_json")"
              if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$base_sha"
              fi
              echo "Selective scope: PR base $base_sha -> head $HEAD_SHA"
              changed_files="$(git diff --name-only "$base_sha" "$HEAD_SHA")"
            elif [[ "$pr_count" -gt 1 ]]; then
              echo "::error::Multiple open PRs found for head branch $REF_NAME; CI cannot choose a safe selective base."
              exit 1
            elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "Selective scope: previous push $BEFORE_SHA -> head $HEAD_SHA"
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            else
              echo "No open PR or previous push base; validating tracked files conservatively."
              changed_files="$(git ls-files)"
            fi
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            changed_files="$(git ls-files)"
          fi

          printf '%s\n' "$changed_files"

          go_required=false
          lint_required=false
          runtime_required=false

          if [[ "$full" == "true" ]] || grep -Eq '(^|/)([^/]+\.go|go\.mod|go\.sum)$|^proto/|^buf\.(yaml|gen\.yaml)$|^scripts/check-architecture\.sh$|^\.github/workflows/ci\.yml$' <<<"$changed_files"; then
            go_required=true
          fi

          if [[ "$full" == "true" ]] || grep -Eq '(^|/)[^/]+\.go$|(^|/)go\.(mod|sum)$|^\.golangci|^\.github/workflows/ci\.yml$' <<<"$changed_files"; then
            lint_required=true
          fi

          if [[ "$full" == "true" ]] || grep -Eq '^deployments/|^scripts/ci/(integration-test|api-smoke)\.sh$|^services/.*/migrations/|(^|/)[^/]*_integration_test\.go$|(^|/)Dockerfile$|docker-compose' <<<"$changed_files"; then
            runtime_required=true
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "go_required=$go_required" >> "$GITHUB_OUTPUT"
          echo "lint_required=$lint_required" >> "$GITHUB_OUTPUT"
          echo "runtime_required=$runtime_required" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.scope.outputs.go_required == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Buf
        if: steps.scope.outputs.go_required == 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          github_token: ${{ github.token }}

      - name: Generate and validate protobuf contracts
        if: steps.scope.outputs.go_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f buf.yaml ]]; then
            echo "No buf.yaml found; protobuf validation not active on this stack yet."
            exit 0
          fi
          buf lint
          buf generate

      - name: Check architecture boundaries
        if: steps.scope.outputs.go_required == 'true'
        run: sh scripts/check-architecture.sh

      - name: Verify Go module manifests are complete
        if: steps.scope.outputs.go_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' modules < <(find . -name go.mod -not -path './vendor/*' -print0)
          if (( ${#modules[@]} == 0 )); then
            echo "::error::No Go modules found. Agent branches must include their prerequisite stack before validation."
            exit 1
          fi

          for module_file in "${modules[@]}"; do
            module_dir="$(dirname "$module_file")"
            echo "::group::go mod tidy check $module_dir"
            (
              cd "$module_dir"
              go mod tidy
              manifest_changes="$(git status --porcelain -- go.mod go.sum)"
              if [[ -n "$manifest_changes" ]]; then
                echo "$manifest_changes"
                echo "::error::go.mod/go.sum are incomplete. Run go mod tidy and commit the result."
                exit 1
              fi
            )
            echo "::endgroup::"
          done

      - name: Build and run Go unit tests
        if: steps.scope.outputs.go_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' modules < <(find . -name go.mod -not -path './vendor/*' -print0)
          for module_file in "${modules[@]}"; do
            module_dir="$(dirname "$module_file")"
            echo "::group::go verify $module_dir"
            (
              cd "$module_dir"
              go build ./...
              go test -count=1 ./...
            )
            echo "::endgroup::"
          done

      - name: Install Go lint
        if: steps.scope.outputs.go_required == 'true' && steps.scope.outputs.lint_required == 'true'
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint Go modules
        if: steps.scope.outputs.go_required == 'true' && steps.scope.outputs.lint_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' modules < <(find . -name go.mod -not -path './vendor/*' -print0)
          for module_file in "${modules[@]}"; do
            module_dir="$(dirname "$module_file")"
            echo "::group::golangci-lint $module_dir"
            (
              cd "$module_dir"
              golangci-lint run ./...
            )
            echo "::endgroup::"
          done

      - name: No Go validation required
        if: steps.scope.outputs.go_required != 'true'
        run: echo "No Go/protobuf/module changes in selective PR scope; executable Go validation skipped."

  runtime:
    name: Runtime / integration validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: needs.verify.outputs.runtime_required == 'true'

    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f deployments/docker-compose.yml ]]; then
            echo "No deployments/docker-compose.yml on this stack yet; no runtime stack to validate."
            exit 0
          fi
          if [[ -f deployments/.env.example && ! -f deployments/.env ]]; then
            cp deployments/.env.example deployments/.env
          fi
          docker compose --env-file deployments/.env -f deployments/docker-compose.yml config

      - name: Run integration tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x scripts/ci/integration-test.sh ]]; then
            scripts/ci/integration-test.sh
          elif [[ -f scripts/ci/integration-test.sh ]]; then
            sh scripts/ci/integration-test.sh
          else
            echo "No integration-test script for this stack."
          fi

      - name: Run API smoke tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x scripts/ci/api-smoke.sh ]]; then
            scripts/ci/api-smoke.sh
          elif [[ -f scripts/ci/api-smoke.sh ]]; then
            sh scripts/ci/api-smoke.sh
          else
            echo "No API smoke script for this stack."
          fi

      - name: Dump container logs on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f deployments/docker-compose.yml && -f deployments/.env ]]; then
            docker compose --env-file deployments/.env -f deployments/docker-compose.yml ps || true
            docker compose --env-file deployments/.env -f deployments/docker-compose.yml logs --no-color --tail=200 || true
          fi

      - name: Tear down runtime stack
        if: always()
        shell: bash
        run: |
          if [[ -f deployments/docker-compose.yml && -f deployments/.env ]]; then
            docker compose --env-file deployments/.env -f deployments/docker-compose.yml down -v --remove-orphans || true
          fi
