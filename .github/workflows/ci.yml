name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runtime_required: ${{ steps.scope.outputs.runtime_required }}

    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Determine validation scope
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          full=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_NAME" == "main" || "$COMMIT_MESSAGE" == *"[full-ci]"* ]]; then
            full=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          fi

          printf '%s\n' "$changed_files"

          go_required=false
          lint_required=false
          runtime_required=false

          if [[ "$full" == "true" ]] || grep -Eq '(^|/)([^/]+\.go|go\.mod|go\.sum)$|^proto/|^buf\.(yaml|gen\.yaml)$|^scripts/check-architecture\.sh$|^\.github/workflows/ci\.yml$' <<<"$changed_files"; then
            go_required=true
          fi

          if [[ "$full" == "true" ]] || grep -Eq '(^|/)[^/]+\.go$|(^|/)go\.(mod|sum)$|^\.golangci|^\.github/workflows/ci\.yml$' <<<"$changed_files"; then
            lint_required=true
          fi

          if [[ "$full" == "true" ]] || grep -Eq '^deployments/|^scripts/ci/(integration-test|api-smoke)\.sh$|^services/.*/migrations/|(^|/)Dockerfile$|docker-compose' <<<"$changed_files"; then
            runtime_required=true
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "go_required=$go_required" >> "$GITHUB_OUTPUT"
          echo "lint_required=$lint_required" >> "$GITHUB_OUTPUT"
          echo "runtime_required=$runtime_required" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.scope.outputs.go_required == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Buf
        if: steps.scope.outputs.go_required == 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"

      - name: Generate and validate protobuf contracts
        if: steps.scope.outputs.go_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f buf.yaml ]]; then
            echo "No buf.yaml found; protobuf validation not active on this stack yet."
            exit 0
          fi
          buf lint
          buf generate

      - name: Check architecture boundaries
        if: steps.scope.outputs.go_required == 'true'
        run: sh scripts/check-architecture.sh

      - name: Verify Go module manifests are complete
        if: steps.scope.outputs.go_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' modules < <(find . -name go.mod -not -path './vendor/*' -print0)
          if (( ${#modules[@]} == 0 )); then
            echo "::error::No Go modules found. Agent branches must include their prerequisite stack before validation."
            exit 1
          fi

          for module_file in "${modules[@]}"; do
            module_dir="$(dirname "$module_file")"
            echo "::group::go mod tidy check $module_dir"
            (
              cd "$module_dir"
              go mod tidy
              manifest_changes="$(git status --porcelain -- go.mod go.sum)"
              if [[ -n "$manifest_changes" ]]; then
                echo "$manifest_changes"
                echo "::error::go.mod/go.sum are incomplete. Run go mod tidy and commit the result."
                exit 1
              fi
            )
            echo "::endgroup::"
          done

      - name: Build and run Go unit tests
        if: steps.scope.outputs.go_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' modules < <(find . -name go.mod -not -path './vendor/*' -print0)
          for module_file in "${modules[@]}"; do
            module_dir="$(dirname "$module_file")"
            echo "::group::go verify $module_dir"
            (
              cd "$module_dir"
              go build ./...
              go test -count=1 ./...
            )
            echo "::endgroup::"
          done

      - name: Install Go lint
        if: steps.scope.outputs.go_required == 'true' && steps.scope.outputs.lint_required == 'true'
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint Go modules
        if: steps.scope.outputs.go_required == 'true' && steps.scope.outputs.lint_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' modules < <(find . -name go.mod -not -path './vendor/*' -print0)
          for module_file in "${modules[@]}"; do
            module_dir="$(dirname "$module_file")"
            echo "::group::golangci-lint $module_dir"
            (
              cd "$module_dir"
              golangci-lint run ./...
            )
            echo "::endgroup::"
          done

      - name: No Go validation required
        if: steps.scope.outputs.go_required != 'true'
        run: echo "No Go/protobuf/module changes in this push; executable Go validation skipped."

  runtime:
    name: Runtime / integration validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: needs.verify.outputs.runtime_required == 'true'

    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f deployments/docker-compose.yml ]]; then
            echo "No deployments/docker-compose.yml on this stack yet; no runtime stack to validate."
            exit 0
          fi
          if [[ -f deployments/.env.example && ! -f deployments/.env ]]; then
            cp deployments/.env.example deployments/.env
          fi
          docker compose --env-file deployments/.env -f deployments/docker-compose.yml config

      - name: Run integration tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x scripts/ci/integration-test.sh ]]; then
            scripts/ci/integration-test.sh
          elif [[ -f scripts/ci/integration-test.sh ]]; then
            sh scripts/ci/integration-test.sh
          else
            echo "No integration-test script for this stack."
          fi

      - name: Run API smoke tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x scripts/ci/api-smoke.sh ]]; then
            scripts/ci/api-smoke.sh
          elif [[ -f scripts/ci/api-smoke.sh ]]; then
            sh scripts/ci/api-smoke.sh
          else
            echo "No API smoke script for this stack."
          fi

      - name: Dump container logs on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f deployments/docker-compose.yml && -f deployments/.env ]]; then
            docker compose --env-file deployments/.env -f deployments/docker-compose.yml ps || true
            docker compose --env-file deployments/.env -f deployments/docker-compose.yml logs --no-color --tail=200 || true
          fi

      - name: Tear down runtime stack
        if: always()
        shell: bash
        run: |
          if [[ -f deployments/docker-compose.yml && -f deployments/.env ]]; then
            docker compose --env-file deployments/.env -f deployments/docker-compose.yml down -v --remove-orphans || true
          fi
