syntax = "proto3";

package hotelbooking.payment.v1;

option go_package = "github.com/liemdang260/hotel-booking/gen/go/hotelbooking/payment/v1;paymentv1";

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);
  rpc GetRefund(GetRefundRequest) returns (GetRefundResponse);
}

message CreatePaymentRequest {
  string booking_id = 1;
  string idempotency_key = 2;
  int64 amount_minor = 3;
  string currency = 4;
  string payment_method_ref = 5;
}

message CreatePaymentResponse {
  Payment payment = 1;
  PaymentError error = 2;
}

message GetPaymentRequest { string payment_id = 1; }
message GetPaymentResponse {
  Payment payment = 1;
  PaymentError error = 2;
}

message Payment {
  string payment_id = 1;
  string booking_id = 2;
  string idempotency_key = 3;
  int64 amount_minor = 4;
  string currency = 5;
  PaymentStatus status = 6;
  string provider_reference = 7;
  string failure_code = 8;
  int64 created_at_unix_ms = 9;
  int64 updated_at_unix_ms = 10;
}

message CreateRefundRequest {
  string payment_id = 1;
  string booking_id = 2;
  string idempotency_key = 3;
  int64 amount_minor = 4;
  string currency = 5;
}
message CreateRefundResponse {
  Refund refund = 1;
  PaymentError error = 2;
}
message GetRefundRequest { string refund_id = 1; }
message GetRefundResponse {
  Refund refund = 1;
  PaymentError error = 2;
}
message Refund {
  string refund_id = 1;
  string payment_id = 2;
  string booking_id = 3;
  string idempotency_key = 4;
  int64 amount_minor = 5;
  string currency = 6;
  RefundStatus status = 7;
  string provider_reference = 8;
  string failure_code = 9;
  int64 created_at_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PROCESSING = 2;
  PAYMENT_STATUS_SUCCEEDED = 3;
  PAYMENT_STATUS_FAILED = 4;
  PAYMENT_STATUS_UNKNOWN = 5;
}
enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_PENDING = 1;
  REFUND_STATUS_PROCESSING = 2;
  REFUND_STATUS_SUCCEEDED = 3;
  REFUND_STATUS_FAILED = 4;
  REFUND_STATUS_UNKNOWN = 5;
}

message PaymentError {
  PaymentErrorCode code = 1;
  string message = 2;
}

enum PaymentErrorCode {
  PAYMENT_ERROR_CODE_UNSPECIFIED = 0;
  PAYMENT_ERROR_CODE_INVALID_ARGUMENT = 1;
  PAYMENT_ERROR_CODE_NOT_FOUND = 2;
  PAYMENT_ERROR_CODE_IDEMPOTENCY_CONFLICT = 3;
  PAYMENT_ERROR_CODE_BOOKING_CONFLICT = 4;
  PAYMENT_ERROR_CODE_CONCURRENT_UPDATE = 5;
  PAYMENT_ERROR_CODE_INTERNAL = 6;
}
