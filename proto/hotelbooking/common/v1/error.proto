syntax = "proto3";

package hotelbooking.common.v1;

option go_package = "github.com/liemdang260/hotel-booking/gen/go/hotelbooking/common/v1;commonv1";

// ErrorDetail carries stable, machine-readable context in addition to the
// canonical gRPC status code and human-readable status message.
message ErrorDetail {
  string reason = 1;
  string request_id = 2;
  map<string, string> metadata = 3;
}
